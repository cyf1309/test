<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#090d16">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>TIME - Poste Garniture</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23090d16'/><text x='50' y='67' font-size='56' text-anchor='middle'>⏱️</text></svg>">
    <style>
        :root {
            --bg-color: #090d16;
            --surface-color: #121826;
            --surface-2: #1a2234;
            --border-default: #263147;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --ok-color: #22c55e;
            --ok-bg: rgba(34, 197, 94, 0.14);
            --warn-color: #f59e0b;
            --warn-bg: rgba(245, 158, 11, 0.16);
            --danger-color: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.18);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            padding: 12px;
            padding-bottom: 32px;
            max-width: 1440px;
            margin: 0 auto;
        }

        button {
            font-family: inherit;
            touch-action: manipulation;
            cursor: pointer;
            border: none;
            transition: transform 0.08s ease, background-color 0.15s ease, opacity 0.15s ease;
        }

        button:active {
            transform: scale(0.97);
        }

        /* HEADER */
        .topbar {
            background: var(--surface-color);
            border: 1px solid var(--border-default);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .topbar-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .app-name {
            font-size: 1.55rem;
            font-weight: 900;
            letter-spacing: 2.5px;
            color: var(--accent);
            margin: 0;
        }

        .app-subtitle {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .clock-box {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .live-clock {
            font-variant-numeric: tabular-nums;
            font-size: 1.1rem;
            font-weight: 800;
            color: #e2e8f0;
            background: var(--surface-2);
            padding: 6px 11px;
            border-radius: 8px;
            border: 1px solid var(--border-default);
        }

        .status-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .pill {
            font-size: 0.78rem;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 999px;
            background: var(--surface-2);
            color: var(--text-muted);
            border: 1px solid var(--border-default);
            font-variant-numeric: tabular-nums;
        }

        .pill.ok { color: var(--ok-color); background: var(--ok-bg); border-color: rgba(34, 197, 94, 0.35); }
        .pill.warn { color: var(--warn-color); background: var(--warn-bg); border-color: rgba(245, 158, 11, 0.4); }
        .pill.danger { color: var(--danger-color); background: var(--danger-bg); border-color: rgba(239, 68, 68, 0.5); }

        /* TOOLBAR ACTIONS */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid var(--border-default);
        }

        .toolbar-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .btn-tool {
            padding: 10px 14px;
            border-radius: 9px;
            font-size: 0.88rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 42px;
        }

        .btn-launch-all {
            background: #2563eb;
            color: #ffffff;
        }

        .btn-stop-all {
            background: var(--surface-2);
            color: #cbd5e1;
            border: 1px solid var(--border-default);
        }

        .btn-stop-all.confirming {
            background: var(--danger-color);
            color: #ffffff;
            border-color: var(--danger-color);
        }

        .btn-sort {
            background: var(--surface-2);
            color: #cbd5e1;
            border: 1px solid var(--border-default);
        }

        .btn-sort.active {
            background: rgba(56, 189, 248, 0.16);
            color: var(--accent);
            border-color: var(--accent);
        }

        .btn-audio {
            background: #d97706;
            color: #ffffff;
        }

        .btn-audio.ready {
            background: #15803d;
        }

        .wakelock-badge {
            font-size: 0.78rem;
            font-weight: 700;
            padding: 8px 10px;
            border-radius: 8px;
            background: var(--surface-2);
            color: var(--text-muted);
            border: 1px solid var(--border-default);
        }

        .wakelock-badge.on {
            color: #4ade80;
            background: rgba(34, 197, 94, 0.12);
            border-color: rgba(34, 197, 94, 0.35);
        }

        /* BANDEAU ALARME ACTIVE */
        .alarm-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid var(--danger-color);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 12px;
            animation: pulse-red 0.7s infinite alternate;
        }

        .alarm-banner.visible {
            display: flex;
            flex-wrap: wrap;
        }

        .alarm-banner-text {
            font-weight: 800;
            font-size: 0.95rem;
            color: #fecaca;
        }

        .btn-silence {
            background: #ffffff;
            color: #991b1b;
            font-weight: 800;
            font-size: 0.85rem;
            padding: 10px 14px;
            border-radius: 8px;
            min-height: 40px;
        }

        /* GRILLE TABLETTE / PC */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
            gap: 12px;
        }

        .card {
            background-color: var(--surface-color);
            border-radius: 14px;
            padding: 14px;
            border: 2px solid var(--border-default);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .card-head {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon {
            font-size: 2.1rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .head-info {
            min-width: 0;
            flex: 1;
        }

        .food-name {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .food-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 3px;
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .badge-duree {
            background: var(--surface-2);
            padding: 2px 7px;
            border-radius: 6px;
            border: 1px solid var(--border-default);
            color: #cbd5e1;
        }

        .end-clock {
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .timer-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
        }

        .timer {
            font-size: 2.05rem;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
            color: #64748b;
            line-height: 1.05;
        }

        .state-tag {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 4px 8px;
            border-radius: 6px;
            background: var(--surface-2);
            color: #64748b;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: var(--surface-2);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #475569;
            border-radius: 999px;
            transition: width 0.5s linear, background-color 0.25s ease;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn-start {
            flex: 2;
            min-height: 46px;
            padding: 10px 8px;
            font-size: 0.92rem;
            font-weight: 800;
            border-radius: 9px;
            background-color: #273549;
            color: #f8fafc;
        }

        .btn-stop {
            flex: 1;
            min-height: 46px;
            padding: 10px 6px;
            font-size: 0.82rem;
            font-weight: 700;
            background-color: var(--surface-2);
            color: var(--text-muted);
            border: 1px solid var(--border-default);
            border-radius: 9px;
        }

        .btn-start.confirming,
        .btn-stop.confirming {
            background-color: #dc2626 !important;
            color: #ffffff !important;
            border-color: #dc2626 !important;
        }

        /* ÉTATS */
        .card.active {
            border-color: var(--ok-color);
        }
        .card.active .timer { color: var(--ok-color); }
        .card.active .state-tag { color: var(--ok-color); background: var(--ok-bg); }
        .card.active .progress-fill { background: var(--ok-color); }
        .card.active .btn-start { background-color: #16a34a; }
        .card.active .end-clock { color: #86efac; }

        .card.warning {
            border-color: var(--warn-color);
            animation: pulse-orange 1s infinite alternate;
        }
        .card.warning .timer { color: var(--warn-color); }
        .card.warning .state-tag { color: var(--warn-color); background: var(--warn-bg); }
        .card.warning .progress-fill { background: var(--warn-color); }
        .card.warning .btn-start { background-color: #d97706; }
        .card.warning .end-clock { color: #fde68a; }

        .card.danger {
            border-color: var(--danger-color);
            background-color: #1f1218;
            animation: pulse-red 0.55s infinite alternate;
        }
        .card.danger .timer { color: var(--danger-color); }
        .card.danger .state-tag { color: #fecaca; background: rgba(239, 68, 68, 0.35); }
        .card.danger .progress-fill { background: var(--danger-color); width: 100% !important; }
        .card.danger .btn-start { background-color: #dc2626; }
        .card.danger .end-clock { color: #fca5a5; }

        @keyframes pulse-orange {
            from { box-shadow: 0 0 4px rgba(245, 158, 11, 0.25); }
            to { box-shadow: 0 0 18px rgba(245, 158, 11, 0.75); }
        }

        @keyframes pulse-red {
            from { box-shadow: 0 0 6px rgba(239, 68, 68, 0.35); }
            to { box-shadow: 0 0 22px rgba(239, 68, 68, 0.95); }
        }

        /* MODALE TOUT LANCER */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.78);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 100;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 400px;
            background: var(--surface-color);
            border: 1px solid var(--border-default);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .modal h2 {
            margin: 0 0 8px 0;
            font-size: 1.15rem;
        }

        .modal p {
            margin: 0 0 16px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-btn {
            width: 100%;
            min-height: 48px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 800;
            padding: 12px 14px;
        }

        .modal-btn.primary { background: #2563eb; color: #fff; }
        .modal-btn.danger { background: #dc2626; color: #fff; }
        .modal-btn.cancel { background: var(--surface-2); color: #cbd5e1; border: 1px solid var(--border-default); }

        /* OPTIMISATION MOBILE ANDROID (< 600px) */
        @media (max-width: 600px) {
            body {
                padding: 8px;
                padding-bottom: 24px;
            }

            .topbar {
                padding: 10px;
                gap: 10px;
            }

            .app-name {
                font-size: 1.35rem;
            }

            .live-clock {
                font-size: 0.95rem;
                padding: 5px 9px;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar-group {
                display: grid;
                grid-template-columns: 1fr 1fr;
                width: 100%;
            }

            .btn-tool {
                justify-content: center;
                padding: 10px 8px;
                font-size: 0.84rem;
            }

            .wakelock-badge {
                grid-column: 1 / -1;
                text-align: center;
                padding: 6px 8px;
            }

            /* 1 colonne compacte sur smartphone pour lire tous les noms sans troncature */
            .grid {
                grid-template-columns: 1fr;
                gap: 9px;
            }

            .card {
                padding: 12px;
                gap: 8px;
            }

            .timer {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <header class="topbar">
        <div class="topbar-row">
            <div class="brand">
                <h1 class="app-name">TIME</h1>
                <span class="app-subtitle">Poste Garniture</span>
            </div>
            <div class="clock-box">
                <div class="status-pills">
                    <span class="pill ok" id="kpiActive">0 actif</span>
                    <span class="pill warn" id="kpiWarn" style="display:none;">0 alerte</span>
                    <span class="pill danger" id="kpiDanger" style="display:none;">0 périmé</span>
                </div>
                <span class="live-clock" id="liveClock">--:--:--</span>
            </div>
        </div>

        <div class="toolbar">
            <div class="toolbar-group">
                <button class="btn-tool btn-launch-all" id="btnStartAll" onclick="handleStartAllClick()">▶ Tout lancer</button>
                <button class="btn-tool btn-stop-all" id="btnStopAll" onclick="handleStopAllClick()">🗑 Tout vider</button>
                <button class="btn-tool btn-sort" id="btnSortMode" onclick="toggleSortMode()">↕ Urgences en haut</button>
                <button class="btn-tool btn-audio" id="audioBtn" onclick="testAudioAndWakeLock()">🔔 Activer Son</button>
            </div>
            <span class="wakelock-badge" id="wakeLockBadge">💡 Anti-veille : inactif</span>
        </div>
    </header>

    <div class="alarm-banner" id="alarmBanner">
        <span class="alarm-banner-text" id="alarmBannerText">🚨 Produit(s) périmé(s) : renouvellement requis !</span>
        <button class="btn-silence" onclick="silenceAlarm()">🔕 Couper la sonnerie</button>
    </div>

    <main class="grid" id="dashboard"></main>

    <!-- Modale de confirmation pour Tout lancer si des bacs sont déjà actifs -->
    <div class="modal-backdrop" id="startAllModal" onclick="if(event.target===this) closeStartAllModal()">
        <div class="modal">
            <h2>▶ Tout lancer</h2>
            <p id="modalDesc"></p>
            <div class="modal-actions">
                <button class="modal-btn primary" id="btnLaunchIdleOnly" onclick="launchAll(false)">Lancer uniquement les bacs arrêtés</button>
                <button class="modal-btn danger" onclick="launchAll(true)">Tout redémarrer à zéro (12 bacs)</button>
                <button class="modal-btn cancel" onclick="closeStartAllModal()">Annuler</button>
            </div>
        </div>
    </div>

    <script>
        const ITEMS = [
            { id: "tomate",         name: "Tomate",              icon: "🍅", dureeTxt: "2h",   sec: 2 * 3600 },
            { id: "fromage",        name: "Fromage",             icon: "🧀", dureeTxt: "2h",   sec: 2 * 3600 },
            { id: "raclette_p",     name: "Raclette Poivre",     icon: "🫕", dureeTxt: "2h",   sec: 2 * 3600 },
            { id: "raclette_a",     name: "Raclette Ail",        icon: "🧄", dureeTxt: "2h",   sec: 2 * 3600 },
            { id: "iceberg",        name: "Salade Iceberg",      icon: "🥬", dureeTxt: "2h",   sec: 2 * 3600 },
            { id: "bacon",          name: "Bacon",               icon: "🥓", dureeTxt: "4h",   sec: 4 * 3600 },
            { id: "bacon_pep",      name: "Bacon Pépites",       icon: "🥓", dureeTxt: "4h",   sec: 4 * 3600 },
            { id: "oignon_frais",   name: "Oignons Frais",       icon: "🧅", dureeTxt: "4h",   sec: 4 * 3600 },
            { id: "oignon_frit",    name: "Oignons Frits",       icon: "🧅", dureeTxt: "12h",  sec: 12 * 3600 },
            { id: "oignon_cara",    name: "Oignons Caramélisés", icon: "🍯", dureeTxt: "2h",   sec: 2 * 3600 },
            { id: "sauce_frites",   name: "Sauce Frites",        icon: "🍟", dureeTxt: "2h",   sec: 2 * 3600 },
            { id: "sauce_raclette", name: "Sauce Raclette",      icon: "🫕", dureeTxt: "1h30", sec: 1.5 * 3600 }
        ];

        const STORAGE_PREFIX = "time_app_";
        const SORT_STORAGE_KEY = "time_app_sort_urgency";
        const WARN_THRESHOLD_SEC = 300; // 5 minutes
        const ALARM_REPEAT_MS = 8000;   // Rappel sonore toutes les 8s si périmé

        let audioContext = null;
        let audioReady = false;
        let wakeLock = null;
        let wakeLockDesired = false;

        let alarmSilenced = false;
        let lastDangerBeepAt = 0;
        let sortByUrgency = localStorage.getItem(SORT_STORAGE_KEY) === "1";

        // Confirmations tactiles temporaires (anti-clic accidentel)
        const confirmPending = {};
        let stopAllConfirmTimeout = null;

        // 1. AUDIO & ANTI-VEILLE
        async function unlockAudio(playTestBeep = false) {
            try {
                if (!audioContext) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return false;
                    audioContext = new AudioCtx();
                }
                if (audioContext.state === "suspended") {
                    await audioContext.resume();
                }
                audioReady = audioContext.state === "running";
                updateAudioButton();
                if (playTestBeep && audioReady) {
                    beep(740, 0.1, 0.22);
                }
                return audioReady;
            } catch (e) {
                return false;
            }
        }

        async function testAudioAndWakeLock() {
            await unlockAudio(true);
            wakeLockDesired = true;
            await requestWakeLock();
        }

        function updateAudioButton() {
            const btn = document.getElementById("audioBtn");
            if (audioReady) {
                btn.classList.add("ready");
                btn.textContent = "🔊 Son prêt";
            } else {
                btn.classList.remove("ready");
                btn.textContent = "🔔 Activer Son";
            }
        }

        async function requestWakeLock() {
            const badge = document.getElementById("wakeLockBadge");

            if (!("wakeLock" in navigator)) {
                badge.classList.remove("on");
                badge.textContent = window.isSecureContext
                    ? "💡 Anti-veille : non supporté"
                    : "💡 Anti-veille : HTTPS requis";
                return;
            }

            if (wakeLock && !wakeLock.released) {
                badge.classList.add("on");
                badge.textContent = "💡 Écran anti-veille actif";
                return;
            }

            try {
                wakeLock = await navigator.wakeLock.request("screen");
                wakeLockDesired = true;
                badge.classList.add("on");
                badge.textContent = "💡 Écran anti-veille actif";

                wakeLock.addEventListener("release", () => {
                    wakeLock = null;
                    badge.classList.remove("on");
                    badge.textContent = "💡 Anti-veille en pause";
                });
            } catch (err) {
                badge.classList.remove("on");
                badge.textContent = "💡 Anti-veille bloqué";
            }
        }

        function beep(freq, duration, volume = 0.28, type = "sine") {
            if (!audioContext || audioContext.state !== "running") return;
            try {
                const now = audioContext.currentTime;
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(volume, now + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.start(now);
                osc.stop(now + duration + 0.02);
            } catch (e) {}
        }

        function playWarningSound() {
            beep(660, 0.14, 0.22);
            setTimeout(() => beep(880, 0.18, 0.25), 180);
            vibrate([120]);
        }

        function playDangerSound() {
            beep(987, 0.14, 0.35, "triangle");
            setTimeout(() => beep(987, 0.14, 0.35, "triangle"), 180);
            setTimeout(() => beep(1318, 0.28, 0.38, "triangle"), 360);
            vibrate([220, 100, 220]);
        }

        function vibrate(pattern) {
            try {
                if ("vibrate" in navigator) {
                    navigator.vibrate(pattern);
                }
            } catch (e) {}
        }

        function silenceAlarm() {
            alarmSilenced = true;
            updateAlarmBanner(lastDangerCount);
        }

        // Déblocage audio automatique au premier toucher n'importe où
        document.addEventListener("pointerdown", () => {
            if (!audioReady) unlockAudio(false);
        }, { passive: true });

        document.addEventListener("visibilitychange", async () => {
            if (document.visibilityState === "visible") {
                if (audioContext && audioContext.state === "suspended") {
                    try {
                        await audioContext.resume();
                        audioReady = audioContext.state === "running";
                        updateAudioButton();
                    } catch (e) {}
                }
                if (wakeLockDesired) {
                    requestWakeLock();
                }
                tick();
            }
        });

        // 2. PERSISTANCE SÉCURISÉE
        function getItemState(id) {
            const raw = localStorage.getItem(STORAGE_PREFIX + id);
            if (!raw) return null;
            try {
                const parsed = JSON.parse(raw);
                if (parsed && typeof parsed.endTime === "number") {
                    return parsed;
                }
            } catch (e) {
                localStorage.removeItem(STORAGE_PREFIX + id);
            }
            return null;
        }

        function saveItemState(id, state) {
            localStorage.setItem(STORAGE_PREFIX + id, JSON.stringify(state));
        }

        // 3. ACTIONS SUR UN BAC
        function startBac(id, sec, silent = false) {
            clearConfirm(id);
            if (!silent) {
                unlockAudio(false);
                wakeLockDesired = true;
                requestWakeLock();
            }

            const now = Date.now();
            const state = {
                startTime: now,
                endTime: now + sec * 1000,
                warnTriggered: false,
                expiredTriggered: false
            };
            saveItemState(id, state);
            if (!silent) tick();
        }

        function stopBac(id, sec, silent = false) {
            clearConfirm(id);
            localStorage.removeItem(STORAGE_PREFIX + id);

            const card = document.getElementById(`card-${id}`);
            const timeEl = document.getElementById(`time-${id}`);
            const endEl = document.getElementById(`end-${id}`);
            const tagEl = document.getElementById(`tag-${id}`);
            const fillEl = document.getElementById(`fill-${id}`);
            const btnStart = document.getElementById(`btn-start-${id}`);
            const btnStop = document.getElementById(`btn-stop-${id}`);

            card.className = "card";
            timeEl.textContent = formatHMS(sec);
            endEl.textContent = "En attente";
            tagEl.textContent = "Arrêté";
            fillEl.style.width = "0%";
            btnStart.textContent = "DÉMARRER";
            btnStart.classList.remove("confirming");
            btnStop.textContent = "VIDER";
            btnStop.classList.remove("confirming");

            if (!silent) tick();
        }

        function handlePrimaryClick(id, sec) {
            const state = getItemState(id);
            const remainingSec = state ? Math.ceil((state.endTime - Date.now()) / 1000) : null;

            // Si arrêté OU déjà périmé -> action immédiate en 1 clic
            if (!state || remainingSec <= 0) {
                startBac(id, sec);
                return;
            }

            // Si en cours -> demande confirmation tactile (2e clic sous 3,5s)
            if (confirmPending[id] === "start") {
                startBac(id, sec);
            } else {
                setConfirm(id, "start");
            }
        }

        function handleStopClick(id, sec) {
            const state = getItemState(id);
            if (!state) return;

            const remainingSec = Math.ceil((state.endTime - Date.now()) / 1000);

            // Si déjà périmé -> vider immédiatement en 1 clic
            if (remainingSec <= 0) {
                stopBac(id, sec);
                return;
            }

            // Si en cours -> demande confirmation tactile
            if (confirmPending[id] === "stop") {
                stopBac(id, sec);
            } else {
                setConfirm(id, "stop");
            }
        }

        function setConfirm(id, action) {
            clearConfirm(id);
            confirmPending[id] = action;

            const btnStart = document.getElementById(`btn-start-${id}`);
            const btnStop = document.getElementById(`btn-stop-${id}`);

            if (action === "start") {
                btnStart.textContent = "CONFIRMER ?";
                btnStart.classList.add("confirming");
            } else {
                btnStop.textContent = "SÛR ?";
                btnStop.classList.add("confirming");
            }

            confirmPending[id + "_timer"] = setTimeout(() => {
                clearConfirm(id);
                tick();
            }, 3500);
        }

        function clearConfirm(id) {
            if (confirmPending[id + "_timer"]) {
                clearTimeout(confirmPending[id + "_timer"]);
                delete confirmPending[id + "_timer"];
            }
            delete confirmPending[id];

            const btnStart = document.getElementById(`btn-start-${id}`);
            const btnStop = document.getElementById(`btn-stop-${id}`);
            if (btnStart) btnStart.classList.remove("confirming");
            if (btnStop) btnStop.classList.remove("confirming");
        }

        // 4. ACTIONS GLOBALES : TOUT LANCER / TOUT VIDER
        function handleStartAllClick() {
            unlockAudio(false);
            wakeLockDesired = true;
            requestWakeLock();

            const activeItems = ITEMS.filter(item => getItemState(item.id) !== null);
            const idleCount = ITEMS.length - activeItems.length;

            // Si aucun bac n'est lancé -> lancement direct de tous les chronos !
            if (activeItems.length === 0) {
                launchAll(true);
                return;
            }

            // Sinon -> modale claire pour éviter d'écraser des chronos en cours par erreur
            const desc = document.getElementById("modalDesc");
            const btnIdle = document.getElementById("btnLaunchIdleOnly");

            if (idleCount > 0) {
                desc.textContent = `${activeItems.length} bac(s) déjà en cours et ${idleCount} arrêté(s). Que souhaitez-vous faire ?`;
                btnIdle.style.display = "block";
                btnIdle.textContent = `▶ Lancer uniquement les arrêtés (${idleCount})`;
            } else {
                desc.textContent = `Les 12 bacs sont déjà en cours. Voulez-vous tout redémarrer à zéro ?`;
                btnIdle.style.display = "none";
            }

            document.getElementById("startAllModal").classList.add("open");
        }

        function closeStartAllModal() {
            document.getElementById("startAllModal").classList.remove("open");
        }

        function launchAll(resetExisting) {
            closeStartAllModal();
            unlockAudio(false);
            wakeLockDesired = true;
            requestWakeLock();

            ITEMS.forEach(item => {
                const existing = getItemState(item.id);
                if (resetExisting || !existing) {
                    startBac(item.id, item.sec, true);
                }
            });

            beep(880, 0.12, 0.22);
            tick();
        }

        function handleStopAllClick() {
            const hasAnyActive = ITEMS.some(item => getItemState(item.id) !== null);
            if (!hasAnyActive) return;

            const btn = document.getElementById("btnStopAll");
            if (btn.classList.contains("confirming")) {
                clearTimeout(stopAllConfirmTimeout);
                btn.classList.remove("confirming");
                btn.textContent = "🗑 Tout vider";
                ITEMS.forEach(item => stopBac(item.id, item.sec, true));
                alarmSilenced = false;
                tick();
            } else {
                btn.classList.add("confirming");
                btn.textContent = "⚠️ Confirmer vider ?";
                stopAllConfirmTimeout = setTimeout(() => {
                    btn.classList.remove("confirming");
                    btn.textContent = "🗑 Tout vider";
                }, 3500);
            }
        }

        function toggleSortMode() {
            sortByUrgency = !sortByUrgency;
            localStorage.setItem(SORT_STORAGE_KEY, sortByUrgency ? "1" : "0");
            updateSortButton();
            tick();
        }

        function updateSortButton() {
            const btn = document.getElementById("btnSortMode");
            btn.classList.toggle("active", sortByUrgency);
            btn.textContent = sortByUrgency ? "🔥 Tri : Urgence" : "↕ Urgences en haut";
        }

        // 5. BOUCLE PRINCIPALE
        let lastDangerCount = 0;

        function initApp() {
            const container = document.getElementById("dashboard");
            container.innerHTML = "";

            ITEMS.forEach(item => {
                const card = document.createElement("div");
                card.className = "card";
                card.id = `card-${item.id}`;

                card.innerHTML = `
                    <div class="card-head">
                        <div class="icon">${item.icon}</div>
                        <div class="head-info">
                            <div class="food-name" title="${item.name}">${item.name}</div>
                            <div class="food-meta">
                                <span class="badge-duree">${item.dureeTxt}</span>
                                <span class="end-clock" id="end-${item.id}">En attente</span>
                            </div>
                        </div>
                    </div>

                    <div class="timer-row">
                        <div class="timer" id="time-${item.id}">${formatHMS(item.sec)}</div>
                        <span class="state-tag" id="tag-${item.id}">Arrêté</span>
                    </div>

                    <div class="progress-track">
                        <div class="progress-fill" id="fill-${item.id}"></div>
                    </div>

                    <div class="actions">
                        <button class="btn-start" id="btn-start-${item.id}" onclick="handlePrimaryClick('${item.id}', ${item.sec})">
                            DÉMARRER
                        </button>
                        <button class="btn-stop" id="btn-stop-${item.id}" onclick="handleStopClick('${item.id}', ${item.sec})">
                            VIDER
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });

            updateSortButton();
            updateAudioButton();
            tick();
            setInterval(tick, 1000);
        }

        function tick() {
            const now = Date.now();
            document.getElementById("liveClock").textContent = formatClock(now, true);

            let activeCount = 0;
            let warnCount = 0;
            let dangerCount = 0;
            let hasNewDanger = false;
            let hasNewWarn = false;

            const priorities = {};

            ITEMS.forEach((item, index) => {
                const state = getItemState(item.id);
                const card = document.getElementById(`card-${item.id}`);
                const timeEl = document.getElementById(`time-${item.id}`);
                const endEl = document.getElementById(`end-${item.id}`);
                const tagEl = document.getElementById(`tag-${item.id}`);
                const fillEl = document.getElementById(`fill-${item.id}`);
                const btnStart = document.getElementById(`btn-start-${item.id}`);
                const btnStop = document.getElementById(`btn-stop-${item.id}`);

                if (!state) {
                    priorities[item.id] = 3000 + index;
                    return;
                }

                const remainingSec = Math.ceil((state.endTime - now) / 1000);
                endEl.textContent = `Fin ${formatClock(state.endTime, false)}`;

                // Barre de progression
                const pct = Math.max(0, Math.min(100, (remainingSec / item.sec) * 100));
                fillEl.style.width = `${pct}%`;

                if (remainingSec <= 0) {
                    // PÉRIMÉ
                    dangerCount++;
                    priorities[item.id] = remainingSec; // plus petit = plus haut

                    timeEl.textContent = "00:00:00";
                    card.className = "card danger";
                    tagEl.textContent = "Périmé";

                    if (!confirmPending[item.id]) {
                        btnStart.textContent = "RENOUVELER";
                        btnStop.textContent = "VIDER";
                    }

                    if (!state.expiredTriggered) {
                        state.expiredTriggered = true;
                        saveItemState(item.id, state);
                        alarmSilenced = false; // Réactive l'alarme si un nouveau bac expire
                        hasNewDanger = true;
                    }
                } else if (remainingSec <= WARN_THRESHOLD_SEC) {
                    // ALERTE 5 MIN
                    warnCount++;
                    priorities[item.id] = 1000 + remainingSec;

                    timeEl.textContent = formatHMS(remainingSec);
                    card.className = "card warning";
                    tagEl.textContent = "Bientôt";

                    if (!confirmPending[item.id]) {
                        btnStart.textContent = "RECHARGER";
                        btnStop.textContent = "VIDER";
                    }

                    if (!state.warnTriggered) {
                        state.warnTriggered = true;
                        saveItemState(item.id, state);
                        hasNewWarn = true;
                    }
                } else {
                    // NORMAL ACTIF
                    activeCount++;
                    priorities[item.id] = 2000 + index;

                    timeEl.textContent = formatHMS(remainingSec);
                    card.className = "card active";
                    tagEl.textContent = "En cours";

                    if (!confirmPending[item.id]) {
                        btnStart.textContent = "RECHARGER";
                        btnStop.textContent = "VIDER";
                    }
                }
            });

            // Sons & rappels
            if (dangerCount > 0) {
                if (hasNewDanger || (!alarmSilenced && now - lastDangerBeepAt >= ALARM_REPEAT_MS)) {
                    playDangerSound();
                    lastDangerBeepAt = now;
                }
            } else {
                alarmSilenced = false;
                if (hasNewWarn) {
                    playWarningSound();
                }
            }

            lastDangerCount = dangerCount;
            updateKPIs(activeCount, warnCount, dangerCount);
            updateAlarmBanner(dangerCount);
            applyOrdering(priorities);
        }

        function updateKPIs(active, warn, danger) {
            const totalRunning = active + warn + danger;
            const kpiA = document.getElementById("kpiActive");
            const kpiW = document.getElementById("kpiWarn");
            const kpiD = document.getElementById("kpiDanger");

            kpiA.textContent = `${totalRunning}/12 actifs`;

            if (warn > 0) {
                kpiW.style.display = "inline-block";
                kpiW.textContent = `${warn} à prévoir`;
            } else {
                kpiW.style.display = "none";
            }

            if (danger > 0) {
                kpiD.style.display = "inline-block";
                kpiD.textContent = `${danger} périmé${danger > 1 ? "s" : ""}`;
            } else {
                kpiD.style.display = "none";
            }
        }

        function updateAlarmBanner(dangerCount) {
            const banner = document.getElementById("alarmBanner");
            const text = document.getElementById("alarmBannerText");
            const btn = banner.querySelector(".btn-silence");

            if (dangerCount > 0) {
                banner.classList.add("visible");
                text.textContent = `🚨 ${dangerCount} bac${dangerCount > 1 ? "s" : ""} périmé${dangerCount > 1 ? "s" : ""} : renouvellement ou retrait requis !`;
                btn.style.display = alarmSilenced ? "none" : "inline-block";
            } else {
                banner.classList.remove("visible");
            }
        }

        function applyOrdering(priorities) {
            const container = document.getElementById("dashboard");
            const desiredOrder = sortByUrgency
                ? [...ITEMS].sort((a, b) => priorities[a.id] - priorities[b.id])
                : ITEMS;

            const currentIds = Array.from(container.children).map(el => el.id);
            const desiredIds = desiredOrder.map(item => `card-${item.id}`);

            const needsReorder = desiredIds.some((id, idx) => currentIds[idx] !== id);
            if (needsReorder) {
                desiredIds.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) container.appendChild(el);
                });
            }
        }

        function formatHMS(totalSeconds) {
            if (totalSeconds < 0) totalSeconds = 0;
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        }

        function formatClock(timestamp, withSeconds) {
            const d = new Date(timestamp);
            const h = String(d.getHours()).padStart(2, "0");
            const m = String(d.getMinutes()).padStart(2, "0");
            if (!withSeconds) return `${h}:${m}`;
            const s = String(d.getSeconds()).padStart(2, "0");
            return `${h}:${m}:${s}`;
        }

        initApp();
    </script>
